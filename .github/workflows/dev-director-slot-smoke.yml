name: DEV director slot chips smoke
on:
  push:
    branches: [feature/v3-supabase-full-clone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  director-slot-chips:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/director-slot-form.cjs
