name: V3 staging package (no production deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/supabase-auth-realtime-v3

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staging entrypoints
        run: |
          test -f login.html
          test -f reservations-preview.html
          test -f supabase-login.js
          test -f supabase-service-bridge.js
          test -f supabase-reservations-preview.js
          test -f supabase-reservation-actions.js
          test -f admin-users.html
          test -f room-config.html
          ! grep -q 'service_role' supabase-login.js
          ! grep -q 'service_role' supabase-service-bridge.js
      - name: Validate JavaScript modules
        run: |
          for file in supabase-*.js; do node --check "$file"; done
      - name: Package standalone V3 staging files
        run: |
          mkdir -p staging
          cp login.html reservations-preview.html admin-users.html room-config.html staging/
          cp supabase-*.js staging/
          test -f staging/supabase-room-config.js
          test -f staging/supabase-admin-users.js
          cat > staging/README.txt <<'EOF'
          RESTOMANAGER V3 - PREVERSION
          Ceci est un paquet de previsualisation, pas un site publie.
          Hebergez ce dossier sur un domaine de test HTTPS distinct du site officiel.
          Point d'entree: login.html
          N'utilisez jamais les comptes ou donnees de production pour les essais.
          EOF
      - name: Smoke-test staging over HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory staging >/tmp/restomanager-staging-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl --silent --fail http://127.0.0.1:8765/login.html >/dev/null; then break; fi
            sleep 1
          done
          for file in login.html reservations-preview.html admin-users.html room-config.html supabase-login.js supabase-service-bridge.js supabase-reservations-preview.js supabase-reservation-actions.js supabase-room-config.js supabase-admin-users.js; do
            curl --fail --silent --show-error "http://127.0.0.1:8765/$file" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: restomanager-v3-staging
          path: staging/
          retention-days: 14
