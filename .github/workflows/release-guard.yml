name: RestoManager - validation avant publication
on:
  pull_request:
    branches:
      - RestoManager-V3
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Vérifier la cible Supabase production
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const environment = fs.readFileSync('restomanager-env.js', 'utf8');
          if (!environment.includes('https://tnsrkargogckgtsxipwd.supabase.co') ||
              !environment.includes('if(location.origin!=="https://dylanl-dev.github.io")') ||
              /lykoybacslvmhtzftqsf|sb_secret_|service_role/i.test(environment)) {
            throw Error('Routage Supabase PROD absent ou exposant un secret');
          }
          for (const file of ['supabase-service-bridge.js', 'supabase-login.js', 'creator-auth.js']) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes("from './restomanager-env.js?v=2026.11.21-rm015.10-main'") ||
                /lykoybacslvmhtzftqsf|sb_secret_|service_role/i.test(source)) {
              throw Error(file + ' : import PROD centralisé invalide');
            }
          }
          const portal = JSON.parse(fs.readFileSync('reservation/runtime.json', 'utf8'));
          if (portal.channel !== 'production' || portal.projectRef !== 'tnsrkargogckgtsxipwd' ||
              portal.publicOrigin !== 'https://dylanl-dev.github.io' ||
              portal.activated !== true ||
              portal.api !== 'https://tnsrkargogckgtsxipwd.supabase.co/functions/v1/rm015-public' ||
              portal.allowedApiOrigin !== 'https://tnsrkargogckgtsxipwd.supabase.co' ||
              portal.turnstileSiteKey !== '0x4AAAAAAGLm9RaVvyWg-GtY') {
            throw Error('Portail public non verrouillé sur le bon projet PROD');
          }
          console.log('Cible Supabase production préservée; aucune connexion DB effectuée.');
          NODE
      - name: Vérifier que l’API officielle est réellement prête (aucune réservation créée)
        if: startsWith(github.head_ref, 'release/rm01511-open-')
        run: |
          node - <<'NODE'
          const https=require('node:https');
          const payload=JSON.stringify({action:'__rm015_preflight__',restaurant:'a-lepicerie-rouen'});
          const req=https.request('https://tnsrkargogckgtsxipwd.supabase.co/functions/v1/rm015-public',{
            method:'POST',headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(payload),'Origin':'https://dylanl-dev.github.io'}
          },response=>{
            let body='';response.on('data',chunk=>{if(body.length<10000)body+=chunk.toString()});
            response.on('end',()=>{
              let result={};try{result=JSON.parse(body)}catch{}
              if(response.statusCode!==400||result.error?.code!=='INVALID'){
                console.error('API non prête : HTTP '+response.statusCode+' / '+(result.error?.code||'UNKNOWN'));
                process.exitCode=1;
              }else console.log('API officielle prête, contrôle sans aucune création de réservation.');
            });
          });
          req.setTimeout(15000,()=>req.destroy(new Error('Précontrôle API expiré')));
          req.on('error',error=>{console.error('Connexion API impossible : '+(error.code||error.message));process.exitCode=1});
          req.end(payload);
          NODE
      - name: Vérifier la syntaxe JavaScript
        run: |
          npm ci --ignore-scripts
          npm run test:syntax
      - name: Tests unitaires sans base de production
        run: npm test
