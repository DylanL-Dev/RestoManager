name: RM-017.1 Signup - isolated onboarding UX and no-write security
on:
  pull_request:
    branches: [feature/v3-supabase-full-clone]
permissions:
  contents: read
jobs:
  signup-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:syntax
      - name: RM-017.1 model, UI contracts and non-registration safety
        run: node --test tests/rm0171-signup.test.cjs
      - name: Seven widths, hotel and independent paths, keyboard, accessibility, no writes
        run: node tests/browser/rm0171-signup.cjs
      - name: RM-UX-03.1 premium login, six widths and isolated Auth fixture
        run: node tests/browser/rmux031-login.cjs
      - name: RM-017.3.1 safe fictitious lifecycle, SIREN derivation, and admin guards
        run: node --test tests/rm01731-lifecycle.test.cjs
      - name: RM-017.3.1 browser owner and Root simulation, mobile, no network writes
        run: node tests/browser/rm01731-simulation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm0171-signup-seven-widths
          path: test-results/rm0171-signup/
