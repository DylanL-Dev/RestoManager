name: V3 regression audit
on:
  push:
    branches: [feature/refonte-service-responsive-v3]
  workflow_dispatch:
jobs:
  reservation-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          for file in reservation-engine.js service-v3*.js; do node --check "$file"; done
      - name: 2800 reservation assertions
        run: node tests/v3-reservation-audit.cjs
