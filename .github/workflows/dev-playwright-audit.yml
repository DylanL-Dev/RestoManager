name: DEV Clone - Playwright mock UI audit
on:
  pull_request:
    branches:
      - feature/v3-supabase-full-clone
  workflow_dispatch:
jobs:
  playwright-mocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Mission 2 isolated browser
        run: npm run test:mission2:browser
      - name: Mission 3 isolated browser
        run: npm run test:mission3:browser
