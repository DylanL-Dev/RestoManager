<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · RestoManager</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light;background:#f3f8f5;color:#163c30}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px}
main{width:min(100%,420px);background:white;border:1px solid #dce9e1;border-radius:22px;padding:32px;box-shadow:0 20px 60px #0c4c2920}
h1{margin:0;font-size:1.65rem}p{line-height:1.5;color:#587469}label{display:block;font-weight:650;margin-top:18px}
input{width:100%;padding:14px;border:1px solid #b8cfc2;border-radius:12px;margin-top:7px;font:inherit}
button{width:100%;border:0;border-radius:12px;padding:14px;background:#087f5b;color:white;font:inherit;font-weight:700;margin-top:24px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.help{background:none;color:#087f5b;border:0;padding:10px;margin-top:10px;text-decoration:underline}.recovery{background:#eef7f1;padding:15px;border-radius:12px;margin-top:8px}.recovery p{margin:0;font-size:.92rem}#message{min-height:1.5em}small{color:#637b70}.platformAccess{border-top:1px solid #e5eee8;margin-top:8px;padding-top:20px;text-align:center}.platformAccess a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 12px;border-radius:10px;color:#17634b;font-size:.88rem;font-weight:650;text-decoration:none}.platformAccess a:hover{background:#eef7f1;text-decoration:underline}.platformAccess a:focus-visible{outline:3px solid #34a77c;outline-offset:2px}
</style></head><body><main><h1>Resto<span style="color:#087f5b">Manager</span></h1>
<p>Connexion à votre espace équipe</p>
<form id="login"><label for="username">Identifiant professionnel</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Votre identifiant" required>
<label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Se connecter</button></form><button class="help" id="forgot" type="button" aria-expanded="false" aria-controls="recovery">Mot de passe oublié ?</button><section id="recovery" class="recovery" hidden><p>Pour réinitialiser votre mot de passe, contactez un responsable habilité de votre établissement. Il vérifiera votre identité et définira un nouveau mot de passe. L’ancien mot de passe ne peut pas être affiché.</p></section>
<p id="message" role="status" aria-live="polite"></p><div class="platformAccess"><a href="creator.html" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir l’administration de la plateforme dans une nouvelle fenêtre">Administration de la plateforme ↗</a></div>
</main><script>document.getElementById("forgot").addEventListener("click",function(){const panel=document.getElementById("recovery");panel.hidden=!panel.hidden;this.setAttribute("aria-expanded",String(!panel.hidden));});</script><script type="module" src="supabase-login.js?v=20261109-auth-timeout1"></script></body></html>
